<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>予約一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="admin-header">
    <h1>予約一覧</h1>

    <a th:href="@{/admin/reservations/new}" class="add-reservation-button">
        ＋ 予約を追加する
    </a>
</div>


    <!-- 氏名・予約希望日・並び順を指定して予約を検索する -->
    <form th:action="@{/admin/reservations#reservation-list}"
          method="get"
          class="search-panel">

        <div class="search-layout">

            <div class="search-fields">

                <div>
                    <label for="customerName">氏名検索</label>
                    <input
                            type="text"
                            id="customerName"
                            name="customerName"
                            th:value="${customerName}"
                            placeholder="氏名を入力"
                    >
                </div>

                <div>
                    <label for="preferredDate">予約希望日検索</label>
                    <input
                            type="date"
                            id="preferredDate"
                            name="preferredDate"
                            th:value="${preferredDate}"
                    >
                </div>

                <div>
                    <label for="order">並び順</label>

                    <select id="order" name="order">
                        <option value="id"
                                th:selected="${order == 'id'}">
                            予約受付順
                        </option>

                        <option value="asc"
                                th:selected="${order == 'asc'}">
                            予約希望日の近い順
                        </option>

                        <option value="desc"
                                th:selected="${order == 'desc'}">
                            予約希望日の遠い順
                        </option>
                    </select>
                </div>

            </div>

            <div class="search-actions">
                <button type="submit" class="search-button">
                    検索・並び替え
                </button>

                <a th:href="@{/admin/reservations}" class="clear-button">
                    検索条件をクリア
                </a>
            </div>

        </div>

    </form>


    <!-- 検索・並び替え後にこの位置へ移動する -->
    <div id="reservation-list"></div>

    <!-- 予約がある場合に一覧を表示する -->
    <div class="table-wrapper" th:if="${!#lists.isEmpty(reservations)}">
        <table border="1">
        <thead>
        <tr>
            <th class="nowrap">氏名</th>
            <th class="nowrap">人数</th>
            <th class="nowrap">予約希望日</th>
            <th>電話番号</th>
            <th>メールアドレス</th>
            <th>備考</th>
            <th class="nowrap">操作</th>
        </tr>
        </thead>

        <tbody>

        <!-- reservationsの中身を1件ずつreservationとして取り出す -->
        <tr th:each="reservation : ${reservations}">
            <td class="nowrap" th:text="${reservation.customerName}"></td>
            <td class="nowrap" th:text="${reservation.numberOfPeople + '人'}"></td>
            <td class="nowrap" th:text="${reservation.preferredDate}"></td>

            <td th:text="${reservation.phoneNumber}"></td>

            <td th:text="${reservation.email}"></td>

            <td th:text="${reservation.remarks != null && reservation.remarks.length() > 20
        ? reservation.remarks.substring(0, 20) + '…'
        : reservation.remarks}">
            </td>

            <td>
                <!-- 予約IDをURLに含めて詳細画面へ移動する -->
                <a th:href="@{/admin/reservations/{id}(id=${reservation.id})}"
                   class="detail-button">
                    詳細
                </a>
            </td>
        </tr>

        </tbody>

        </table>

    </div>

<!-- 管理者ログアウト -->
<div class="actions">

    <!-- 予約が1件もない場合に表示する -->
    <p th:if="${#lists.isEmpty(reservations)}">
        予約情報はありません。
    </p>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-button">ログアウト</button>
    </form>
</div>

</body>
</html>
