<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>予約一覧</title>
</head>

<body>

<h1>予約一覧</h1>

<!-- 氏名で予約を検索する -->
<form th:action="@{/reservations/search}" method="get">

    <label for="customerName">氏名検索</label>

    <input
            type="text"
            id="customerName"
            name="customerName"
            th:value="${customerName}"
            placeholder="氏名を入力"
    >

    <button type="submit">検索</button>

</form>

<!-- 予約希望日を指定して予約を検索する -->
<form th:action="@{/reservations/date-search}" method="get">

    <label for="preferredDate">予約希望日検索</label>

    <input
            type="date"
            id="preferredDate"
            name="preferredDate"
            th:value="${preferredDate}"
    >

    <button type="submit">検索</button>

</form>

<!-- 予約希望日で一覧を並び替える -->
<form th:action="@{/reservations/sort}" method="get">

    <label for="order">並び順</label>

    <select id="order" name="order">
        <option value="asc"
                th:selected="${order == null or order == 'asc'}">
            予約希望日の近い順
        </option>

        <option value="desc"
                th:selected="${order == 'desc'}">
            予約希望日の遠い順
        </option>
    </select>

    <button type="submit">並び替え</button>
</form>

<p>
    <a th:href="@{/reservations}">検索をクリア</a>
</p>

<!-- 予約が1件もない場合に表示する -->
<p th:if="${#lists.isEmpty(reservations)}">
    予約情報はありません。
</p>

<!-- 予約がある場合に一覧を表示する -->
<table th:if="${!#lists.isEmpty(reservations)}" border="1">

    <thead>
    <tr>
        <th>氏名</th>
        <th>人数</th>
        <th>予約希望日</th>
        <th>電話番号</th>
        <th>メールアドレス</th>
        <th>備考</th>
        <th>操作</th>
    </tr>
    </thead>

    <tbody>

    <!-- reservationsの中身を1件ずつreservationとして取り出す -->
    <tr th:each="reservation : ${reservations}">
        <td th:text="${reservation.customerName}"></td>

        <td>
            <span th:text="${reservation.numberOfPeople}"></span>
            人
        </td>

        <td th:text="${reservation.preferredDate}"></td>

        <td th:text="${reservation.phoneNumber}"></td>

        <td th:text="${reservation.email}"></td>

        <td th:text="${reservation.remarks}"></td>

        <td>
            <!-- 予約IDをURLに含めて詳細画面へ移動する -->
            <a th:href="@{/reservations/{id}(id=${reservation.id})}">
                詳細
            </a>
        </td>
    </tr>

    </tbody>

</table>

<p>
    <a th:href="@{/reservations/new}">新しい予約を登録する</a>
</p>

</body>
</html>
