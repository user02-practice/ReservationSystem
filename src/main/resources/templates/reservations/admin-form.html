<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>予約追加</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h1>予約を追加</h1>

    <!-- 管理者が予約情報を入力するフォーム -->
    <form th:action="@{/admin/reservations}"
          th:object="${reservation}"
          method="post">

        <!-- 予約者の氏名 -->
        <div>
            <label for="customerName">氏名 ※必須</label>

            <input
                    type="text"
                    id="customerName"
                    th:field="*{customerName}"
            >

            <p class="error"
               th:if="${#fields.hasErrors('customerName')}"
               th:errors="*{customerName}">
            </p>
        </div>

        <!-- 予約人数 -->
        <div>
            <label for="numberOfPeople">人数 ※必須</label>

            <div class="number-input-wrapper">
                <input
                        type="number"
                        id="numberOfPeople"
                        th:field="*{numberOfPeople}"
                        min="1"
                >
                <span class="number-unit">人</span>
            </div>

            <p class="error"
               th:if="${#fields.hasErrors('numberOfPeople')}"
               th:errors="*{numberOfPeople}">
            </p>
        </div>

        <!-- 予約希望日 -->
        <div>
            <label for="preferredDate">予約希望日 ※必須</label>

            <input
                    type="date"
                    id="preferredDate"
                    th:field="*{preferredDate}"
            >

            <p class="error"
               th:if="${#fields.hasErrors('preferredDate')}"
               th:errors="*{preferredDate}">
            </p>
        </div>

        <!-- 予約者の電話番号 -->
        <div>
            <label for="phoneNumber">電話番号（任意）</label>

            <input
                    type="text"
                    id="phoneNumber"
                    th:field="*{phoneNumber}"
            >
        </div>

        <!-- 予約者のメールアドレス -->
        <div>
            <label for="email">メールアドレス（任意）</label>

            <input
                    type="email"
                    id="email"
                    th:field="*{email}"
            >

            <p class="error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">
            </p>
        </div>

        <!-- 予約に関する備考 -->
        <div>
            <label for="remarks">備考（任意・100文字以内）</label>

            <textarea
                    id="remarks"
                    th:field="*{remarks}"
                    maxlength="100"
                    placeholder="お目当てのアーティスト等"
            ></textarea>

            <p class="error"
               th:if="${#fields.hasErrors('remarks')}"
               th:errors="*{remarks}">
            </p>
        </div>

        <!-- 管理者予約追加画面の操作 -->
        <div class="admin-form-actions">

            <button type="submit" class="admin-save-button">
                予約を追加する
            </button>

            <a th:href="@{/admin/reservations}"
               class="admin-back-button">
                予約一覧に戻る
            </a>

        </div>

    </form>

</div>
</body>
</html>
