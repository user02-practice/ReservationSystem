<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ログイン</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container login-container">

    <h1>管理者ログイン</h1>

    <!-- ログインに失敗した場合のエラーメッセージ -->
    <p class="error" th:if="${param.error}">
        ユーザー名またはパスワードが正しくありません。
    </p>

    <!-- ログアウトした場合のメッセージ -->
    <p class="success" th:if="${param.logout}">
        ログアウトしました。
    </p>

    <form th:action="@{/login}" method="post">

        <div>
            <label for="username">ユーザー名</label>
            <input type="text"
                   id="username"
                   name="username"
                   autofocus>
        </div>

        <div>
            <label for="password">パスワード</label>
            <input type="password"
                   id="password"
                   name="password">
        </div>

        <div>
            <button type="submit" class="login-button">ログイン</button>
        </div>

    </form>

    <div class="actions">
        <a th:href="@{/reservations/new}">予約登録画面へ戻る</a>
    </div>

</div>

</body>
</html>
