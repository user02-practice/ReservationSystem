<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ログイン</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container login-container">

    <h1>管理者ログイン</h1>

    <!-- ログインに失敗した場合のエラーメッセージ -->
    <p class="error" th:if="${param.error}">
        ユーザー名またはパスワードが正しくありません。
    </p>

    <!-- ログアウトした場合のメッセージ -->
    <p class="logout-toast" id="logout-message" th:if="${param.logout}">
        ✓ ログアウトしました
    </p>

    <form th:action="@{/login}" method="post">

        <div>
            <label for="username">ユーザー名</label>
            <input type="text"
                   id="username"
                   name="username"
                   autofocus
                   onclick="this.select()">
        </div>

        <div>
            <label for="password">パスワード</label>
            <input type="password"
                   id="password"
                   name="password"
                   onclick="this.select()">

            <label class="show-password">
                <input type="checkbox" id="show-password">
                パスワードを表示
            </label>
        </div>

        <div>
            <button type="submit" class="login-button">
                ログイン
            </button>
        </div>

    </form>

</div>

<script>

    const username = document.getElementById("username");
    let firstUsernameInput = true;

    username.addEventListener("beforeinput", (event) => {
        if (firstUsernameInput && event.inputType === "insertText") {
            username.value = "";
            firstUsernameInput = false;
        }
    });

    // パスワードの表示・非表示を切り替える
    const password = document.getElementById("password");
    const showPassword = document.getElementById("show-password");

    showPassword.addEventListener("change", () => {
        password.type = showPassword.checked ? "text" : "password";
    });

    // ログアウトメッセージを一定時間後に消す
    setTimeout(() => {
        const message = document.getElementById("logout-message");

        if (message) {
            message.classList.add("fade-out");

            // URLから「?logout」を削除する
            const url = new URL(window.location.href);
            url.searchParams.delete("logout");

            window.history.replaceState(
                {},
                "",
                url.pathname + url.search + url.hash
            );
        }
    }, 2500);
</script>

</body>
</html>
